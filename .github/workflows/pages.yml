name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: List the puzzles
        run: node tools/build-index.js
      - name: Gather the site
        run: |
          mkdir _site
          cp index.html app.css app.js core.js worker.js qrcode.js sw.js manifest.webmanifest _site/
          cp -r puzzles pack icons _site/
      - name: Stamp the version
        run: |
          BUILT=$(date -u +'%-d %b %Y')
          sed -i "s/__VERSION__/${{ github.run_number }}/g; s/__BUILT__/$BUILT/g" _site/app.js _site/sw.js
          grep -o "VERSION='[^']*'" _site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
